<title>Limerick Astronomy Club — Sky Gallery</title>
<link rel="stylesheet" href="styles.css">

<div id="gate">
  <h1>🔭 Limerick Astronomy Club</h1>
  <p>This gallery is for club members and friends. Enter the password to view.</p>
  <form id="gate-form">
    <input type="password" id="gate-password" placeholder="Password" autocomplete="off" autofocus>
    <button type="submit">Enter</button>
  </form>
  <div id="gate-error"></div>
</div>

<div id="app">
  <header class="site-header">
    <h1>🔭 Limerick Astronomy Club — Sky Gallery</h1>
    <p>Photos shared by the club, November 2023 to present</p>
  </header>
  <main id="gallery"></main>
  <footer>A private showcase for club members and friends.</footer>
</div>

<div id="lightbox">
  <button class="lb-close" id="lb-close" aria-label="Close">✕</button>
  <button class="lb-nav lb-prev" id="lb-prev" aria-label="Previous">‹</button>
  <button class="lb-nav lb-next" id="lb-next" aria-label="Next">›</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-meta">
    <div class="lb-date" id="lb-date"></div>
    <div class="lb-caption" id="lb-caption"></div>
  </div>
</div>

<script src="app.js"></script>
